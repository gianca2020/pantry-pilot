[project]
name = "pantry-pilot"
version = "0.1.0"
description = "Applied-AI CLI that manages pantry inventory with a deterministic, event-sourced ledger."
readme = "README.md"
authors = [
    { name = "gianca2020", email = "giancarloforero@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "typer>=0.27.1",
]

[project.scripts]
pantry = "pantry_pilot.cli:app"   # live once Step 5 creates cli.py

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
